name: log4lib CI/CD

on: [push, pull_request]

jobs:
  log4lib-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          push: ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: cmake -DCMAKE_BUILD_TYPE=Release -B build -S . && cmake --build build --target log4lib_test log4lib

      - name: Run unit tests
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          push: ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: ctest --test-dir build --extra-verbose

      - name: Test fetch content
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          push: ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: |
            cd test-cmake-fetch-content && rm -rf ./${BUILD_DIR}
            cmake -DCMAKE_BUILD_TYPE=Release -B ${BUILD_DIR} -S .
            cmake --build ${BUILD_DIR} --target log4libtestfetchcontent
            ./${BUILD_DIR}/log4libtestfetchcontent
            rm -rf ./${BUILD_DIR}
