name: log4lib CI/CD

on: [push, pull_request]

jobs:
  devcontainer-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Downcase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set env vars
        run: echo "BUILD_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV

      - name: Build
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          push: ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: cmake -DCMAKE_BUILD_TYPE=Release -B ${{ env.BUILD_DIR }} -S .

      - name: Run unit tests
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_LOWER }}/devcontainer
          push: ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
          runCmd: ctest --test-dir ${{ env.BUILD_DIR }} --extra-verbose
